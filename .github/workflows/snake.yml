name: update-profile-stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Rimus0cod&show_icons=true&theme=tokyonight&hide_border=true&rank_icon=github&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Rimus0cod&layout=compact&theme=tokyonight&hide_border=true&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate FlyBrain card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Rimus0cod&repo=FlyBrain&theme=tokyonight&hide_border=true&description_lines_count=2
          path: profile/flybrain.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate control card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Rimus0cod&repo=control&theme=tokyonight&hide_border=true
          path: profile/control.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate AI balancer card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Rimus0cod&repo=AI_balancer&theme=tokyonight&hide_border=true
          path: profile/ai-balancer.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile stats" || exit 0
          git push
